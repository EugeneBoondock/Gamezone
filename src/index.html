<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Platform</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.2/chess.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js"></script>
</head>
<body>
    <canvas id="background-canvas"></canvas>
    <div id="app">
        <header>
            <h1>2D Game Platform</h1>
            <nav id="game-menu">
                <button data-game="tictactoe">Tic-Tac-Toe</button>
                <button data-game="snake">Snake</button>
                <button data-game="checkers">Checkers</button>
                <button data-game="chess">Chess</button>
            </nav>
            <button id="settings-btn">Settings</button>
        </header>
        <main id="game-container">
            <h2>Select a game to start!</h2>
        </main>
        <footer>
            <p>Powered by Bun & Jules</p>
        </footer>
    </div>

    <div id="settings-modal" class="hidden">
        <div class="modal-content">
            <h2>Settings</h2>
            <div class="setting-row">
                <label for="difficulty-setting">Difficulty:</label>
                <select id="difficulty-setting">
                    <option value="easy">Easy</option>
                    <option value="medium" selected>Medium</option>
                    <option value="hard">Hard</option>
                </select>
            </div>
            <div class="setting-row">
                <label for="opponent-setting">Opponent:</label>
                <select id="opponent-setting">
                    <option value="ai">AI</option>
                    <option value="human">Human</option>
                </select>
            </div>
            <div class="setting-row">
                <label>Sound:</label>
                <label class="switch">
                    <input type="checkbox" id="sound-setting" checked>
                    <span class="slider round"></span>
                </label>
            </div>
            <button id="close-settings-btn">Close</button>
        </div>
    </div>

    <script src="background.js"></script>
    <script src="script.js"></script>
</body>
</html>
